<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><meta name="description" content="拾日｜拾起每一天的小事，留住时间。"><title>拾日</title><style>
:root{--bg:#f8f6f0;--paper:#fffdf8;--text:#42463e;--muted:#a1a197;--line:#ebe8df;--soft:#f1efe8;--sage:#778b7d;--sage2:#e9efe9;--accent:#607567;--shadow:0 16px 50px rgba(70,70,55,.055)}[data-theme=dark]{--bg:#1e211e;--paper:#292c28;--text:#eeeae0;--muted:#9a9c95;--line:#3a3d38;--soft:#32352f;--sage:#a6b7a9;--sage2:#354238;--accent:#b8c8ba;--shadow:0 16px 50px rgba(0,0,0,.2)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans",sans-serif;letter-spacing:.01em}.app{width:min(650px,100%);margin:auto;padding:34px 22px 90px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:62px}.brand{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:31px;letter-spacing:3px}.tagline{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.06em}.theme{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--text);cursor:pointer;font-size:15px}.date{text-align:center}.date-number{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:48px;letter-spacing:2px;line-height:1}.date-meta{font-size:12px;color:var(--muted);margin-top:13px}.date-nav{display:flex;justify-content:center;gap:8px;margin-top:20px}.round{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:20px}.round:hover{background:var(--soft);color:var(--text)}.hero{margin-top:55px;text-align:center}.prompt{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:22px;line-height:1.6}.subprompt{font-size:12px;color:var(--muted);margin-top:6px}.record-box{margin:27px auto 0;max-width:560px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:4px 0 8px}.record-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);padding:10px 5px;font-size:14px;text-align:left}.record-box input::placeholder{color:#b0b0a7}.record-box button{border:0;background:var(--accent);color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:17px}.today-list{display:grid;gap:2px;max-width:560px;margin:27px auto 0;text-align:left}.today-item{display:flex;gap:12px;align-items:flex-start;padding:10px 4px}.dot{width:5px;height:5px;border-radius:50%;background:var(--sage);margin-top:9px;flex:none}.entry-text{font-size:14px;line-height:1.75;flex:1;word-break:break-word}.entry-time{font-size:10px;color:var(--muted);margin-top:2px}.entry-actions{opacity:0;display:flex;gap:2px}.today-item:hover .entry-actions{opacity:1}.mini-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;padding:4px}.memory-section{margin-top:78px}.memory-title{text-align:center;font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:20px}.memory-note{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}.years{margin-top:25px;display:grid;gap:0}.year-card{padding:20px 7px;border-top:1px solid var(--line);cursor:pointer}.year-head{display:flex;justify-content:space-between;align-items:center}.year{font-size:12px;color:var(--muted);letter-spacing:.06em}.year.current{color:var(--sage);font-weight:600}.memory{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:14px;line-height:1.8;margin-top:8px}.empty-memory{font-size:12px;color:var(--muted);margin-top:8px}.memory-more{font-size:11px;color:var(--muted);margin-top:5px}.quiet-note{text-align:center;color:var(--muted);font-size:11px;margin-top:32px;line-height:1.8}.archive{margin-top:66px;text-align:center}.archive button{border:0;background:transparent;color:var(--sage);font-size:12px;cursor:pointer;padding:10px 18px}.calendar-panel{display:none;margin-top:13px}.calendar-panel.show{display:block}.calendar{background:var(--paper);border-radius:22px;padding:18px;box-shadow:var(--shadow);text-align:left}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.cal-title{font-size:14px;font-weight:600}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal-week{font-size:10px;color:var(--muted);padding:5px 0}.day{height:36px;border:0;border-radius:10px;background:transparent;color:var(--text);cursor:pointer;font-size:12px}.day:hover{background:var(--soft)}.day.has{font-weight:700;position:relative}.day.has:after{content:'';position:absolute;width:4px;height:4px;background:var(--sage);border-radius:50%;left:50%;bottom:4px;transform:translateX(-50%)}.day.selected{background:var(--sage2)}.day.muted{color:var(--muted);opacity:.3}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(650px,100%);padding:8px 20px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:4}.bottom button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:11px}.bottom button.active{color:var(--sage);font-weight:650}.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;background:rgba(25,28,24,.42);display:none;align-items:flex-end;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.sheet{width:min(580px,100%);background:var(--paper);border-radius:26px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.16)}.sheet-top{display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:0;font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:19px}.close{border:0;background:var(--soft);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer}.sheet-date{color:var(--muted);font-size:12px;margin:7px 0 16px}.sheet textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:16px;padding:13px;font:14px/1.7 inherit;outline:0}.sheet-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.sheet-actions button{border:0;border-radius:12px;padding:10px 16px;cursor:pointer}.cancel{background:var(--soft);color:var(--text)}.save{background:var(--accent);color:#fff}@media(max-width:520px){.app{padding-top:25px}.top{margin-bottom:48px}.date-number{font-size:43px}.hero{margin-top:45px}.prompt{font-size:20px}.entry-actions{opacity:1}.memory-section{margin-top:62px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">拾日</div><div class="tagline">拾起每一天的小事，留住时间。</div></div><button class="theme" id="theme" aria-label="切换主题">☼</button></header><section class="date"><div class="date-number" id="dateNumber"></div><div class="date-meta" id="dateMeta"></div><div class="date-nav"><button class="round" id="prevDay">‹</button><button class="round" id="todayBtn">今</button><button class="round" id="nextDay">›</button></div></section><section class="hero"><div class="prompt" id="prompt">今天，有什么值得留下？</div><div class="subprompt" id="subprompt">一两句话就很好。</div><form class="record-box" id="recordForm"><input id="recordInput" autocomplete="off" placeholder="写下一件今天的小事……"><button aria-label="记下">＋</button></form><div class="today-list" id="todayList"></div></section><section class="memory-section"><div class="memory-title">往年的今天</div><div class="memory-note">同一天 · 不同的时间</div><div class="years" id="years"></div><div class="quiet-note" id="quietNote"></div></section><section class="archive"><button id="calendarToggle">翻一翻日历</button><div class="calendar-panel" id="calendarPanel"><div class="calendar"><div class="cal-head"><button class="round" id="prevMonth">‹</button><div class="cal-title" id="calTitle"></div><button class="round" id="nextMonth">›</button></div><div class="cal-grid" id="calGrid"></div></div></div></section></main><nav class="bottom"><button class="active" id="homeNav">今天</button></nav><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="sheet"><div class="sheet-top"><h3>修改这件小事</h3><button class="close" id="closeModal">×</button></div><div class="sheet-date" id="modalDate"></div><textarea id="modalText" placeholder="想到什么就写什么……"></textarea><div class="sheet-actions"><button class="cancel" id="cancelModal">取消</button><button class="save" id="saveModal">保存</button></div></div></div><script>
const KEY='shiri-moments-v1',THEME='shiri-theme-v1';let data=JSON.parse(localStorage.getItem(KEY)||'{}'),selectedDate=isoToday(),calendarDate=new Date(),editingIndex=null;const $=id=>document.getElementById(id);function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function isoToday(){return localISO(new Date())}function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function entries(s){return Array.isArray(data[s])?data[s]:[]}function setEntries(s,a){if(a.length)data[s]=a;else delete data[s];save()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtMeta(s){const d=parseISO(s),w=new Intl.DateTimeFormat('zh-CN',{weekday:'long'}).format(d);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${w}`}function renderHeader(){const d=parseISO(selectedDate);$('dateNumber').textContent=`${d.getMonth()+1}月${d.getDate()}日`;$('dateMeta').textContent=fmtMeta(selectedDate);const n=entries(selectedDate).length;$('prompt').textContent=n===0?'今天，有什么值得留下？':n===1?'再拾一件？':n===2?'今天还有什么小事？':'今天已经被你好好留下了。';$('subprompt').textContent=n===0?'一两句话就很好。':n<3?'不用写很多，记住就好。':'这些小事，以后会回来找你。'}function renderToday(){const a=entries(selectedDate);$('todayList').innerHTML=a.map((x,i)=>`<div class="today-item"><span class="dot"></span><div class="entry-text">${esc(x.text)}<div class="entry-time">${esc(x.time||'')}</div></div><div class="entry-actions"><button class="mini-btn" data-edit="${i}">编辑</button><button class="mini-btn" data-del="${i}">删除</button></div></div>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const a=entries(selectedDate);a.splice(+b.dataset.del,1);setEntries(selectedDate,a);render();toast('已放回今天的记忆')});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(selectedDate,+b.dataset.edit))}function renderYears(){const current=parseISO(selectedDate).getFullYear(),m=parseISO(selectedDate).getMonth()+1,d=parseISO(selectedDate).getDate();let html='',found=0;for(let i=1;i<=Math.min(10,current-1900);i++){const y=current-i,s=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=entries(s);if(a.length)found++;html+=`<div class="year-card"><div class="year-head"><span class="year">${y}</span><span class="year">${a.length?`${a.length} 件记录`:''}</span></div>${a.length?`<div class="memory">${esc(a.slice(0,3).map(x=>x.text).join(' · '))}</div>${a.length>3?`<div class="memory-more">还有 ${a.length-3} 件</div>`:''}`:`<div class="empty-memory">这一年的今天，还没有留下记录。</div>`}</div>`}$('years').innerHTML=html;$('quietNote').textContent=found===0?'故事还在很远的以后。先从今天开始。':found===1?'原来，你已经把某一个今天留给了未来。':`这些年，你在这一天留下了 ${found} 年的片段。`;document.querySelectorAll('.year-card').forEach((el,i)=>el.onclick=()=>{const y=current-(i+1),s=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(entries(s).length)openEdit(s,0)})}function renderCalendar(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();$('calTitle').textContent=`${y}年 ${m+1}月`;let h=['一','二','三','四','五','六','日'].map(x=>`<div class="cal-week">${x}</div>`).join('');for(let i=0;i<start;i++)h+=`<button class="day muted"></button>`;for(let d=1;d<=days;d++){const s=localISO(new Date(y,m,d));h+=`<button class="day ${entries(s).length?'has':''} ${s===selectedDate?'selected':''}" data-day="${s}">${d}</button>`}$('calGrid').innerHTML=h;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.day;calendarDate=parseISO(selectedDate);render();window.scrollTo({top:0,behavior:'smooth'})})}function render(){renderHeader();renderToday();renderYears();renderCalendar()}function addEntry(text){text=text.trim();if(!text)return;const a=entries(selectedDate),now=new Date();a.push({id:Date.now(),text,time:now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});setEntries(selectedDate,a);$('recordInput').value='';render();toast('今天，已经被你拾起一件小事')}$('recordForm').onsubmit=e=>{e.preventDefault();addEntry($('recordInput').value)}function moveDay(n){const d=parseISO(selectedDate);d.setDate(d.getDate()+n);selectedDate=localISO(d);calendarDate=d;render();window.scrollTo({top:0,behavior:'smooth'})}$('prevDay').onclick=()=>moveDay(-1);$('nextDay').onclick=()=>moveDay(1);$('todayBtn').onclick=()=>{selectedDate=isoToday();calendarDate=new Date();render();window.scrollTo({top:0,behavior:'smooth'})};$('theme').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'':'dark';document.documentElement.dataset.theme=next;if(next)localStorage.setItem(THEME,next);else localStorage.removeItem(THEME);$('theme').textContent=next?'☾':'☼'};if(localStorage.getItem(THEME)){$('theme').textContent='☾';document.documentElement.dataset.theme='dark'}function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1800)}function openEdit(s,i){if(i<0)return;editingIndex=i;selectedDate=s;$('modalDate').textContent=fmtMeta(s);$('modalText').value=entries(s)[i].text;$('modal').classList.add('show');setTimeout(()=>$('modalText').focus(),80)}function closeModal(){$('modal').classList.remove('show');editingIndex=null}$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('saveModal').onclick=()=>{if(editingIndex===null)return;const a=entries(selectedDate);const text=$('modalText').value.trim();if(text)a[editingIndex].text=text;else a.splice(editingIndex,1);setEntries(selectedDate,a);closeModal();render();toast('已保存')};$('calendarToggle').onclick=()=>{$('calendarPanel').classList.toggle('show');if($('calendarPanel').classList.contains('show'))$('calendarToggle').textContent='收起日历';else $('calendarToggle').textContent='翻一翻日历'};$('prevMonth').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar()};$('nextMonth').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar()};$('homeNav').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});render();
</script></body></html>
