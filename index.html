<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f3"><title>Todo</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--text:#242424;--muted:#8b8b8b;--line:#ddd;--soft:#e8e8e5;--accent:#222;--shadow:#0000000a}
[data-theme=dark]{--bg:#181818;--card:#242424;--text:#f2f2f2;--muted:#999;--line:#444;--soft:#363636;--accent:#f2f2f2;--shadow:#0006}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;transition:.2s}.app{max-width:760px;margin:0 auto;padding:42px 20px 40px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.title{font-size:38px;font-weight:750;letter-spacing:-1.5px}.date{font-size:13px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:8px}.icon-btn{border:0;background:var(--soft);color:var(--text);width:36px;height:36px;border-radius:11px;cursor:pointer;font-size:17px}.add{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-bottom:12px}input,select{border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);padding:13px 14px;font-size:15px;outline:none}input:focus,select:focus{border-color:var(--muted)}.btn{border:0;border-radius:13px;background:var(--accent);color:var(--bg);padding:0 19px;font-size:15px;cursor:pointer}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px}.options label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.options input{width:100%}.filters{display:flex;gap:7px;margin-bottom:18px;overflow:auto}.filter{border:0;background:transparent;padding:7px 12px;border-radius:10px;color:var(--muted);cursor:pointer;white-space:nowrap}.filter.active{background:var(--soft);color:var(--text)}.list{display:grid;gap:9px}.item{display:flex;align-items:flex-start;gap:11px;background:var(--card);border-radius:15px;padding:14px 13px;box-shadow:0 1px 3px var(--shadow);cursor:grab}.item.dragging{opacity:.45}.drag{color:var(--muted);font-size:18px;padding-top:1px;cursor:grab}.check{width:21px;height:21px;border:1.5px solid #aaa;border-radius:50%;cursor:pointer;flex:none;margin-top:1px}.done .check{background:var(--accent);border-color:var(--accent);position:relative}.done .check:after{content:'✓';color:var(--bg);position:absolute;font-size:13px;left:4px;top:0}.content{flex:1;min-width:0}.text{font-size:15px;line-height:1.45;word-break:break-word}.done .text{text-decoration:line-through;color:var(--muted)}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;font-size:11px;color:var(--muted)}.tag{padding:3px 7px;border-radius:7px;background:var(--soft)}.priority-high{color:#c44}.priority-medium{color:#b27a18}.priority-low{color:#54815c}.overdue{color:#c44}.del{border:0;background:transparent;color:var(--muted);font-size:19px;cursor:pointer;padding:0 3px}.empty{text-align:center;color:var(--muted);padding:50px 0}.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:18px}.clear{border:0;background:transparent;color:var(--muted);cursor:pointer}@media(max-width:560px){.app{padding-top:30px}.title{font-size:32px}.add{grid-template-columns:1fr auto}.add select{display:none}.options{grid-template-columns:1fr}.date{display:none}}
</style></head>
<body><main class="app"><div class="top"><div><div class="title">Todo</div><div class="date" id="date"></div></div><div class="top-actions"><button class="icon-btn" id="theme" title="深色模式">☾</button></div></div>
<form class="add" id="form"><input id="input" autocomplete="off" placeholder="今天要做什么？"><select id="priority" title="优先级"><option value="low">低优先级</option><option value="medium" selected>中优先级</option><option value="high">高优先级</option></select><button class="btn">添加</button></form>
<div class="options"><label>截止日期 <input id="due" type="date"></label><label>任务安排 <select id="schedule"><option value="today">今天</option><option value="tomorrow">明天</option><option value="future">未来</option></select></label></div>
<nav class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="today">今天</button><button class="filter" data-filter="tomorrow">明天</button><button class="filter" data-filter="future">未来</button><button class="filter" data-filter="active">待完成</button><button class="filter" data-filter="done">已完成</button></nav>
<section class="list" id="list"></section><div class="footer"><span id="count"></span><button class="clear" id="clear">清除已完成</button></div></main>
<script>
const KEY='todo-app-items-v2',THEME='todo-app-theme-v1';let items=JSON.parse(localStorage.getItem(KEY)||'[]');let filter='all';let dragId=null;
const $=id=>document.getElementById(id), today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}, addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
$('date').textContent=new Intl.DateTimeFormat('zh-CN',{dateStyle:'full'}).format(new Date());
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function priorityName(p){return p==='high'?'高':p==='medium'?'中':'低'}
function scheduleName(s){return s==='today'?'今天':s==='tomorrow'?'明天':'未来'}
function escape(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function visible(x){if(filter==='all')return true;if(filter==='active')return !x.done;if(filter==='done')return x.done;return x.schedule===filter}
function render(){const list=$('list');const shown=items.filter(visible);if(!shown.length){list.innerHTML='<div class="empty">没有任务 ✨</div>'}else{list.innerHTML=shown.map(x=>{const overdue=x.due&&!x.done&&x.due<today();return `<article class="item ${x.done?'done':''}" draggable="true" data-id="${x.id}"><span class="drag">⋮⋮</span><button class="check" aria-label="完成" data-act="toggle"></button><div class="content"><div class="text">${escape(x.text)}</div><div class="meta"><span class="tag">${scheduleName(x.schedule)}</span><span class="tag priority-${x.priority}">优先级：${priorityName(x.priority)}</span>${x.due?`<span class="tag ${overdue?'overdue':''}">截止：${x.due}</span>`:''}</div></div><button class="del" data-act="delete" aria-label="删除">×</button></article>`}).join('')}
$('count').textContent=`${items.filter(x=>!x.done).length} 项待完成`;
list.querySelectorAll('.item').forEach(el=>{el.addEventListener('dragstart',()=>{dragId=el.dataset.id;el.classList.add('dragging')});el.addEventListener('dragend',()=>{dragId=null;el.classList.remove('dragging')});el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();const target=el.dataset.id;if(!dragId||target===dragId)return;const from=items.findIndex(x=>x.id===dragId),to=items.findIndex(x=>x.id===target);const [m]=items.splice(from,1);items.splice(to,0,m);save();render()});el.addEventListener('click',e=>{const act=e.target.dataset.act;if(!act)return;const i=items.findIndex(x=>x.id===el.dataset.id);if(i<0)return;if(act==='toggle')items[i].done=!items[i].done;if(act==='delete')items.splice(i,1);save();render()})})}
$('form').addEventListener('submit',e=>{e.preventDefault();const text=$('input').value.trim();if(!text)return;items.push({id:Date.now().toString(),text,done:false,priority:$('priority').value,schedule:$('schedule').value,due:$('due').value||null});$('input').value='';$('due').value='';save();render()});
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});$('clear').onclick=()=>{items=items.filter(x=>!x.done);save();render()};
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem(THEME,t);$('theme').textContent=t==='dark'?'☀':'☾'}setTheme(localStorage.getItem(THEME)||'light');$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
render();
</script></body></html>
