<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f6f2"><meta name="description" content="一个帮你整理生活，而不是催你完成的 Todo。"><title>今天 · Todo</title>
<style>
:root{--bg:#f6f6f2;--card:#fff;--text:#242421;--muted:#91918a;--line:#e7e7e0;--soft:#eeeee9;--accent:#252522;--green:#6d866f;--warn:#b77b38;--danger:#b45e5e;--shadow:0 8px 30px #00000008}
[data-theme=dark]{--bg:#181816;--card:#252522;--text:#f3f3ed;--muted:#9c9c94;--line:#3c3c37;--soft:#33332f;--accent:#f1f1eb;--green:#91a993;--warn:#d49b58;--danger:#d27b7b;--shadow:0 8px 30px #0008}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;transition:.25s}.app{width:min(760px,100%);margin:auto;padding:34px 20px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:5px}.title{font-size:35px;font-weight:760;letter-spacing:-1.5px}.subtitle{font-size:14px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px}.icon{border:0;background:var(--soft);color:var(--text);width:38px;height:38px;border-radius:13px;cursor:pointer;font-size:17px}.capture{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--shadow);margin-bottom:23px}.capture-row{display:flex;gap:9px}.capture input{border:0;background:transparent;color:var(--text);font-size:16px;padding:11px 8px;outline:0;flex:1;min-width:0}.capture button{border:0;border-radius:14px;background:var(--accent);color:var(--bg);padding:0 17px;font-size:14px;cursor:pointer}.hint{font-size:11px;color:var(--muted);padding:0 9px 5px}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 4px}.chip{border:0;background:var(--soft);color:var(--muted);padding:7px 10px;border-radius:10px;white-space:nowrap;cursor:pointer;font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:25px 2px 12px}.section-title{font-size:18px;font-weight:700}.section-note{font-size:12px;color:var(--muted)}.focus{background:var(--card);border-radius:20px;padding:15px;box-shadow:var(--shadow);margin-bottom:22px}.focus-title{font-size:12px;color:var(--muted);margin-bottom:12px}.focus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.focus-slot{min-height:70px;border:1px dashed var(--line);border-radius:14px;padding:10px;cursor:pointer;position:relative}.focus-slot.filled{border-style:solid;background:var(--soft)}.focus-num{font-size:11px;color:var(--muted)}.focus-text{font-size:13px;line-height:1.35;margin-top:5px}.focus-slot .remove-focus{display:none;position:absolute;right:7px;top:5px;border:0;background:transparent;color:var(--muted);cursor:pointer}.focus-slot:hover .remove-focus{display:block}.context-row{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.context{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:13px;padding:8px 12px;cursor:pointer;white-space:nowrap;font-size:12px}.context.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}.filters{display:flex;gap:6px;overflow:auto;margin-bottom:13px}.filter{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:10px;cursor:pointer;white-space:nowrap}.filter.active{background:var(--soft);color:var(--text)}.list{display:grid;gap:8px}.item{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:16px;padding:13px 12px;box-shadow:0 2px 12px #00000005;transition:.15s}.item.dragging{opacity:.45}.drag{color:var(--muted);font-size:16px;padding-top:2px;cursor:grab;user-select:none}.check{width:21px;height:21px;border:1.5px solid #aaa;background:transparent;border-radius:50%;cursor:pointer;flex:none;margin-top:1px}.done .check{background:var(--accent);border-color:var(--accent);position:relative}.done .check:after{content:'✓';color:var(--bg);position:absolute;left:4px;top:0;font-size:13px}.content{flex:1;min-width:0}.text{font-size:15px;line-height:1.45;word-break:break-word}.done .text{text-decoration:line-through;color:var(--muted)}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tag{font-size:11px;color:var(--muted);background:var(--soft);padding:3px 7px;border-radius:7px}.high{color:var(--danger)}.medium{color:var(--warn)}.overdue{color:var(--danger)}.del{border:0;background:transparent;color:var(--muted);font-size:19px;cursor:pointer}.empty{text-align:center;padding:45px 10px;color:var(--muted);font-size:14px}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:5px}.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:14px}.clear{border:0;background:transparent;color:var(--muted);cursor:pointer}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.sheet{width:min(620px,100%);background:var(--card);color:var(--text);border-radius:24px;padding:20px;box-shadow:0 20px 60px #0004}.sheet h3{margin:0 0 5px}.sheet p{margin:0 0 16px;color:var(--muted);font-size:13px}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.edit-grid label{font-size:11px;color:var(--muted)}.edit-grid input,.edit-grid select{width:100%;margin-top:5px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px;border-radius:11px}.sheet-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.sheet-actions button{border:0;padding:10px 15px;border-radius:11px;cursor:pointer}.cancel{background:var(--soft);color:var(--text)}.save{background:var(--accent);color:var(--bg)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);padding:9px 20px calc(9px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);display:flex;justify-content:space-around;border-top:1px solid var(--line)}.bottom button{border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;padding:5px 16px}.bottom button.active{color:var(--text);font-weight:700}@media(max-width:520px){.app{padding-top:27px}.title{font-size:31px}.focus-grid{grid-template-columns:1fr 1fr 1fr}.focus-slot{min-height:78px}.edit-grid{grid-template-columns:1fr}.hint{display:none}}
</style></head>
<body><main class="app">
<header class="top"><div><div class="eyebrow" id="weekday"></div><div class="title">今天</div><div class="subtitle" id="date"></div></div><div class="actions"><button class="icon" id="theme" title="切换深色模式">☾</button></div></header>
<section class="capture"><form class="capture-row" id="captureForm"><input id="captureInput" autocomplete="off" placeholder="想到什么，先放进来……"><button>收下</button></form><div class="hint">试试：明天给小王发资料 · 周五前完成方案 · 晚上买牛奶</div><div class="chips"><button class="chip" data-quick="今天">今天</button><button class="chip" data-quick="明天">明天</button><button class="chip" data-quick="周五">周五</button><button class="chip" data-quick="高优先">高优先</button></div></section>
<section><div class="section-head"><div class="section-title">今天，只做三件事</div><div class="section-note" id="focusCount">0 / 3</div></div><div class="focus"><div class="focus-title">把最重要的事情留在这里，其他事情不用抢位置。</div><div class="focus-grid" id="focusGrid"></div></div></section>
<section><div class="section-head"><div class="section-title">按情境找任务</div><div class="section-note">你在哪里，就做什么</div></div><div class="context-row" id="contexts"></div></section>
<section><div class="filters" id="filters"><button class="filter active" data-filter="today">今天</button><button class="filter" data-filter="tomorrow">明天</button><button class="filter" data-filter="future">以后</button><button class="filter" data-filter="all">全部</button><button class="filter" data-filter="done">已完成</button></div><div class="list" id="list"></div><div class="stats"><span id="stats"></span><button class="clear" id="clear">清除已完成</button></div></section>
</main><nav class="bottom"><button class="active" data-bottom="today">☀<br>今天</button><button data-bottom="all">☷<br>所有</button><button data-bottom="done">✓<br>完成</button></nav>
<div class="modal" id="modal"><div class="sheet"><h3>编辑任务</h3><p>任务可以改变，不必一次安排得完美。</p><div class="edit-grid"><label>内容<input id="editText"></label><label>情境<select id="editContext"></select></label><label>安排<select id="editSchedule"><option value="today">今天</option><option value="tomorrow">明天</option><option value="future">以后</option></select></label><label>优先级<select id="editPriority"><option value="low">普通</option><option value="medium">重要</option><option value="high">最重要</option></select></label><label>截止日期<input id="editDue" type="date"></label></div><div class="sheet-actions"><button class="cancel" id="cancelEdit">取消</button><button class="save" id="saveEdit">保存</button></div></div></div>
<script>
const KEY='todo-app-items-v2',THEME='todo-app-theme-v2',CONTEXTS=[['all','全部','✦'],['home','🏠 在家','🏠'],['work','💼 工作','💼'],['out','🛒 外出','🛒'],['computer','💻 电脑前','💻'],['phone','📱 手机上','📱']];
let items=JSON.parse(localStorage.getItem(KEY)||'[]').map(x=>({...x,context:x.context||'work',schedule:x.schedule||'today',priority:x.priority||'medium',focus:!!x.focus}));let filter='today',context='all',dragId=null,editId=null;
const $=id=>document.getElementById(id), today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}, addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const dateNow=today();$('weekday').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'long'}).format(new Date());$('date').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(new Date());
function save(){localStorage.setItem(KEY,JSON.stringify(items))}function escape(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function pname(p){return p==='high'?'最重要':p==='medium'?'重要':'普通'}function cname(c){return (CONTEXTS.find(x=>x[0]===c)||CONTEXTS[0])[1].replace(/^.. /,'')}
function parseCapture(raw){let text=raw.trim(),schedule='today',priority='medium',due='';if(/明天/.test(text)){schedule='tomorrow';due=addDays(dateNow,1)}else if(/后天/.test(text)){schedule='future';due=addDays(dateNow,2)}else if(/周[一二三四五六日天]/.test(text)){schedule='future';const m=text.match(/周([一二三四五六日天])/),map={一:1,二:2,三:3,四:4,五:5,六:6,日:0,天:0};let target=map[m[1]],d=new Date();let diff=(target-d.getDay()+7)%7;if(diff===0)diff=7;due=addDays(dateNow,diff)}if(/高优先|最重要|重要/.test(text))priority=/高优先|最重要/.test(text)?'high':'medium';text=text.replace(/(今天|明天|后天|周[一二三四五六日天]|高优先|最重要|重要)/g,'').replace(/^[，,、\s]+|[，,、\s]+$/g,'');return{text:text||raw,schedule,priority,due}}
function renderContexts(){ $('contexts').innerHTML=CONTEXTS.map(x=>`<button class="context ${context===x[0]?'active':''}" data-context="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-context]').forEach(b=>b.onclick=()=>{context=b.dataset.context;render()})}
function matches(x){if(context!=='all'&&x.context!==context)return false;if(filter==='today')return x.schedule==='today'&&!x.done;if(filter==='tomorrow')return x.schedule==='tomorrow'&&!x.done;if(filter==='future')return x.schedule==='future'&&!x.done;if(filter==='done')return x.done;return true}
function renderFocus(){const chosen=items.filter(x=>x.focus&&!x.done&&x.schedule==='today').slice(0,3);$('focusCount').textContent=`${chosen.length} / 3`;let html='';for(let i=0;i<3;i++){const x=chosen[i];html+=x?`<div class="focus-slot filled" data-focus-id="${x.id}"><span class="focus-num">0${i+1}</span><div class="focus-text">${escape(x.text)}</div><button class="remove-focus">×</button></div>`:`<div class="focus-slot" data-empty-focus="1"><span class="focus-num">0${i+1}</span><div class="focus-text">选一件最重要的事</div></div>`}$('focusGrid').innerHTML=html;document.querySelectorAll('[data-focus-id]').forEach(el=>el.querySelector('.remove-focus').onclick=e=>{e.stopPropagation();const x=items.find(x=>x.id===el.dataset.focusId);if(x)x.focus=false;save();render()});document.querySelectorAll('[data-empty-focus]').forEach(el=>el.onclick=()=>{const candidate=items.find(x=>x.schedule==='today'&&!x.done&&!x.focus);if(candidate){candidate.focus=true;save();render()}else alert('先添加一件今天的任务吧。')})}
function renderList(){const shown=items.filter(matches);$('list').innerHTML=shown.length?shown.map(x=>{const overdue=x.due&&!x.done&&x.due<dateNow;return `<article class="item ${x.done?'done':''}" draggable="true" data-id="${x.id}"><span class="drag">⋮⋮</span><button class="check" data-act="toggle"></button><div class="content" data-act="edit"><div class="text">${escape(x.text)}</div><div class="meta"><span class="tag">${cname(x.context)}</span><span class="tag ${x.priority==='high'?'high':x.priority==='medium'?'medium':''}">${pname(x.priority)}</span>${x.due?`<span class="tag ${overdue?'overdue':''}">截止 ${x.due}</span>`:''}</div></div><button class="del" data-act="delete">×</button></article>`}).join(''):'<div class="empty"><strong>这里很安静</strong>没有需要你现在处理的事。';
$('stats').textContent=`还有 ${items.filter(x=>!x.done).length} 件事，慢慢来。`;
$('list').querySelectorAll('.item').forEach(el=>{el.addEventListener('dragstart',()=>{dragId=el.dataset.id;el.classList.add('dragging')});el.addEventListener('dragend',()=>{dragId=null;el.classList.remove('dragging')});el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();if(!dragId||dragId===el.dataset.id)return;const a=items.findIndex(x=>x.id===dragId),b=items.findIndex(x=>x.id===el.dataset.id);const[m]=items.splice(a,1);items.splice(b,0,m);save();render()});el.addEventListener('click',e=>{const act=e.target.dataset.act;if(act==='toggle'){const x=items.find(x=>x.id===el.dataset.id);x.done=!x.done;if(x.done)x.focus=false;save();render()}else if(act==='delete'){items=items.filter(x=>x.id!==el.dataset.id);save();render()}else if(act==='edit'){openEdit(el.dataset.id)}})})}
function render(){document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));renderContexts();renderFocus();renderList()}
$('captureForm').onsubmit=e=>{e.preventDefault();const raw=$('captureInput').value;if(!raw.trim())return;const p=parseCapture(raw);items.push({id:Date.now().toString(),text:p.text,done:false,priority:p.priority,schedule:p.schedule,due:p.due||null,context:'work',focus:false});$('captureInput').value='';save();filter=p.schedule;render()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('captureInput').value=b.dataset.quick;$('captureInput').focus()});
$('filters').onclick=e=>{const b=e.target.closest('.filter');if(b){filter=b.dataset.filter;render()}};$('clear').onclick=()=>{items=items.filter(x=>!x.done);save();render()};document.querySelectorAll('[data-bottom]').forEach(b=>b.onclick=()=>{filter=b.dataset.bottom==='done'?'done':b.dataset.bottom==='all'?'all':'today';document.querySelectorAll('[data-bottom]').forEach(x=>x.classList.toggle('active',x===b));render()});
function openEdit(id){editId=id;const x=items.find(x=>x.id===id);$('editText').value=x.text;$('editContext').innerHTML=CONTEXTS.slice(1).map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('');$('editContext').value=x.context;$('editSchedule').value=x.schedule;$('editPriority').value=x.priority;$('editDue').value=x.due||'';$('modal').classList.add('show')};$('cancelEdit').onclick=()=>$('modal').classList.remove('show');$('saveEdit').onclick=()=>{const x=items.find(x=>x.id===editId);x.text=$('editText').value.trim()||x.text;x.context=$('editContext').value;x.schedule=$('editSchedule').value;x.priority=$('editPriority').value;x.due=$('editDue').value||null;save();$('modal').classList.remove('show');render()};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem(THEME,t);$('theme').textContent=t==='dark'?'☀':'☾'}setTheme(localStorage.getItem(THEME)||'light');$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');render();
</script></body></html>
