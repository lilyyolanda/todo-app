<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><meta name="description" content="拾日｜拾起每一天的小事，留住时间。"><title>拾日 · 五年日历</title><style>
:root{--bg:#f7f5ef;--paper:#fffefa;--text:#3d4038;--muted:#9a9a90;--line:#e9e6dc;--soft:#f0eee6;--sage:#718778;--sage2:#e7eee8;--accent:#566b5b;--shadow:0 12px 40px rgba(70,70,55,.06)}[data-theme=dark]{--bg:#1d201d;--paper:#272a26;--text:#eeeee6;--muted:#999c94;--line:#393d37;--soft:#31352f;--sage:#9aaf9c;--sage2:#344238;--accent:#b5c6b7;--shadow:0 12px 40px rgba(0,0,0,.18)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans",sans-serif;letter-spacing:.01em;transition:.25s}.app{width:min(680px,100%);margin:auto;padding:32px 20px calc(80px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px}.brand{font-size:30px;font-weight:700;letter-spacing:-1px}.tagline{font-size:12px;color:var(--muted);margin-top:6px}.theme{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--text);cursor:pointer;font-size:16px}.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.date-main{display:flex;align-items:baseline;gap:10px}.month{font-size:28px;font-weight:650;letter-spacing:-1px}.weekday{font-size:13px;color:var(--muted)}.date-actions{display:flex;gap:7px}.round{border:0;background:var(--soft);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer}.hero{padding:28px 24px 25px;background:var(--paper);border-radius:26px;box-shadow:var(--shadow);margin-bottom:25px}.hero-label{font-size:12px;color:var(--sage);font-weight:600;letter-spacing:.12em}.hero h1{font-size:25px;line-height:1.35;margin:11px 0 8px;letter-spacing:-.5px}.hero p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}.record-box{margin-top:22px;border:1px solid var(--line);background:var(--bg);border-radius:17px;padding:6px;display:flex;gap:6px}.record-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);padding:11px 10px;font-size:14px}.record-box button{border:0;background:var(--accent);color:#fff;border-radius:13px;padding:0 16px;cursor:pointer;font-size:13px}.today-list{display:grid;gap:9px;margin-top:18px}.today-item{display:flex;gap:10px;align-items:flex-start;padding:10px 2px}.dot{width:7px;height:7px;border-radius:50%;background:var(--sage);margin-top:7px;flex:none}.entry-text{font-size:14px;line-height:1.65;flex:1;word-break:break-word}.entry-time{font-size:10px;color:var(--muted);margin-top:3px}.entry-actions{opacity:0;display:flex;gap:2px}.today-item:hover .entry-actions{opacity:1}.mini-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px}.section{margin-top:31px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 2px 12px}.section-title{font-size:17px;font-weight:650}.section-note{font-size:11px;color:var(--muted)}.years{display:grid;gap:9px}.year-card{background:var(--paper);border-radius:18px;padding:16px 17px;min-height:66px;box-shadow:0 4px 20px rgba(70,70,55,.035);cursor:pointer;transition:.15s}.year-card:hover{transform:translateY(-1px)}.year-head{display:flex;justify-content:space-between;align-items:center}.year{font-size:12px;color:var(--muted);letter-spacing:.05em}.today-year .year:first-child{color:var(--sage);font-weight:600}.memory{font-size:13px;line-height:1.6;margin-top:6px}.empty-memory{font-size:12px;color:var(--muted);font-style:italic}.memory-more{font-size:11px;color:var(--muted);margin-top:5px}.archive{margin-top:36px;text-align:center}.archive button{border:0;background:transparent;color:var(--sage);font-size:12px;cursor:pointer;padding:10px 18px}.calendar-panel{display:none}.calendar-panel.show{display:block}.calendar{background:var(--paper);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.cal-title{font-size:14px;font-weight:600}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal-week{font-size:10px;color:var(--muted);padding:5px 0}.day{height:36px;border:0;border-radius:10px;background:transparent;color:var(--text);cursor:pointer;font-size:12px}.day:hover{background:var(--soft)}.day.has{font-weight:700;position:relative}.day.has:after{content:'';position:absolute;width:4px;height:4px;background:var(--sage);border-radius:50%;left:50%;bottom:4px;transform:translateX(-50%)}.day.selected{background:var(--sage2)}.day.muted{color:var(--muted);opacity:.4}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(680px,100%);padding:10px 20px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:55px;z-index:4}.bottom button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;line-height:1.7}.bottom button.active{color:var(--sage);font-weight:650}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;background:rgba(25,28,24,.42);display:none;align-items:flex-end;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.sheet{width:min(580px,100%);background:var(--paper);border-radius:26px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.16)}.sheet-top{display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:0;font-size:18px}.close{border:0;background:var(--soft);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer}.sheet-date{color:var(--muted);font-size:12px;margin:7px 0 16px}.sheet textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:16px;padding:13px;font:14px/1.7 inherit;outline:0}.sheet-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.sheet-actions button{border:0;border-radius:12px;padding:10px 16px;cursor:pointer}.cancel{background:var(--soft);color:var(--text)}.save{background:var(--accent);color:#fff}@media(max-width:520px){.app{padding-top:25px}.hero{padding:23px 19px}.hero h1{font-size:22px}.brand{font-size:28px}.entry-actions{opacity:1}.bottom{gap:42px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">拾日</div><div class="tagline">拾起每一天的小事，留住时间。</div></div><button class="theme" id="theme" aria-label="切换主题">☼</button></header><div class="date-nav"><div class="date-main"><div class="month" id="dateTitle"></div><div class="weekday" id="weekday"></div></div><div class="date-actions"><button class="round" id="prevDay">‹</button><button class="round" id="todayBtn">今</button><button class="round" id="nextDay">›</button></div></div><section class="hero"><div class="hero-label">TODAY · 今天</div><h1>今天发生了什么？</h1><p>不用写成日记。<br>记下几件小事，几年以后，它们会替你记住今天。</p><form class="record-box" id="recordForm"><input id="recordInput" autocomplete="off" placeholder="记一件小事……"><button>记下</button></form><div class="today-list" id="todayList"></div></section><section class="section"><div class="section-head"><div class="section-title">往年的今天</div><div class="section-note">同一天 · 不同的你</div></div><div class="years" id="years"></div></section><section class="archive" id="archive"><button id="calendarToggle">查看日历 · 找找某一天</button><div class="calendar-panel" id="calendarPanel"><div class="calendar"><div class="cal-head"><button class="round" id="prevMonth">‹</button><div class="cal-title" id="calTitle"></div><button class="round" id="nextMonth">›</button></div><div class="cal-grid" id="calGrid"></div></div></div></section></main><nav class="bottom"><button class="active" id="homeNav">✦<br>今天</button><button id="calendarNav">□<br>日历</button></nav><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="sheet"><div class="sheet-top"><h3>记录这一天</h3><button class="close" id="closeModal">×</button></div><div class="sheet-date" id="modalDate"></div><textarea id="modalText" placeholder="想到什么就写什么……一两句话也很好。"></textarea><div class="sheet-actions"><button class="cancel" id="cancelModal">取消</button><button class="save" id="saveModal">保存</button></div></div></div><script>
const KEY='shiri-moments-v1',THEME='shiri-theme-v1';let data=JSON.parse(localStorage.getItem(KEY)||'{}'),selectedDate=isoToday(),calendarDate=new Date(),editingId=null;const $=id=>document.getElementById(id);function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function isoToday(){return localISO(new Date())}function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function entries(s){return Array.isArray(data[s])?data[s]:[]}function setEntries(s,a){if(a.length)data[s]=a;else delete data[s];save()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s){return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(parseISO(s))}function renderHeader(){const d=parseISO(selectedDate);$('dateTitle').textContent=`${d.getMonth()+1}月${d.getDate()}日`;$('weekday').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'long'}).format(d)}function renderToday(){const a=entries(selectedDate);$('todayList').innerHTML=a.length?a.map((x,i)=>`<div class="today-item"><span class="dot"></span><div class="entry-text">${esc(x.text)}<div class="entry-time">${esc(x.time||'')}</div></div><div class="entry-actions"><button class="mini-btn" data-edit="${i}">编辑</button><button class="mini-btn" data-del="${i}">删除</button></div></div>`).join(''):`<div style="color:var(--muted);font-size:12px;padding:5px 2px 0">还没有记录。今天发生的小事，值得留下来。</div>`;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const a=entries(selectedDate);a.splice(+b.dataset.del,1);setEntries(selectedDate,a);render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(selectedDate,+b.dataset.edit))}function renderYears(){const current=parseISO(selectedDate).getFullYear(),m=parseISO(selectedDate).getMonth()+1,d=parseISO(selectedDate).getDate();let html='';for(let i=0;i<5;i++){const y=current-i,s=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=entries(s);html+=`<div class="year-card ${i===0?'today-year':''}" data-memory-date="${s}"><div class="year-head"><span class="year">${y}${i===0?' · 今天':''}</span><span class="year">${a.length?`${a.length} 件小事`:''}</span></div>${a.length?`<div class="memory">${esc(a.slice(0,2).map(x=>x.text).join(' · '))}</div>${a.length>2?`<div class="memory-more">还有 ${a.length-2} 件</div>`:''}`:`<div class="empty-memory">这一年的今天，还没有留下记录。</div>`}</div>`}$('years').innerHTML=html;document.querySelectorAll('[data-memory-date]').forEach(el=>el.onclick=()=>openEdit(el.dataset.memoryDate,-1))}function renderCalendar(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();$('calTitle').textContent=`${y}年 ${m+1}月`;let h=['一','二','三','四','五','六','日'].map(x=>`<div class="cal-week">${x}</div>`).join('');for(let i=0;i<start;i++)h+=`<button class="day muted"></button>`;for(let d=1;d<=days;d++){const s=localISO(new Date(y,m,d));h+=`<button class="day ${entries(s).length?'has':''} ${s===selectedDate?'selected':''}" data-day="${s}">${d}</button>`}$('calGrid').innerHTML=h;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.day;calendarDate=parseISO(selectedDate);render();window.scrollTo({top:0,behavior:'smooth'})})}function render(){renderHeader();renderToday();renderYears();renderCalendar()}function addEntry(text){text=text.trim();if(!text)return;const a=entries(selectedDate),now=new Date();a.push({id:Date.now(),text,time:now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});setEntries(selectedDate,a);$('recordInput').value='';render();toast('已拾起一件小事')}function moveDay(n){const d=parseISO(selectedDate);d.setDate(d.getDate()+n);selectedDate=localISO(d);render()}$('recordForm').onsubmit=e=>{e.preventDefault();addEntry($('recordInput').value)};$('prevDay').onclick=()=>moveDay(-1);$('nextDay').onclick=()=>moveDay(1);$('todayBtn').onclick=()=>{selectedDate=isoToday();calendarDate=new Date();render()};function openEdit(s,i){editingId=i;selectedDate=s;$('modalDate').textContent=fmt(s);$('modalText').value=i>=0?entries(s)[i].text:'';$('modal').classList.add('show');setTimeout(()=>$('modalText').focus(),80)}function closeModal(){$('modal').classList.remove('show');editingId=null}$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('saveModal').onclick=()=>{const text=$('modalText').value.trim();if(!text){toast('写下一点点就好');return}const a=entries(selectedDate);if(editingId>=0)a[editingId].text=text;else a.push({id:Date.now(),text,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});setEntries(selectedDate,a);closeModal();render();toast('已保存')};$('calendarToggle').onclick=()=>{$('calendarPanel').classList.toggle('show');renderCalendar()};$('prevMonth').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar()};$('nextMonth').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar()};$('calendarNav').onclick=()=>{$('calendarPanel').classList.add('show');$('archive').scrollIntoView({behavior:'smooth'});$('calendarNav').classList.add('active');$('homeNav').classList.remove('active')};$('homeNav').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});$('homeNav').classList.add('active');$('calendarNav').classList.remove('active')};$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';localStorage.setItem(THEME,dark?'light':'dark');$('theme').textContent=dark?'☼':'☾'};if(localStorage.getItem(THEME)==='dark'){document.documentElement.dataset.theme='dark';$('theme').textContent='☾'}let tt;function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),1600)}render();
</script></body></html>
