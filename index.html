<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5"><title>Todo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}.app{max-width:720px;margin:0 auto;padding:56px 20px 40px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.title{font-size:38px;font-weight:750;letter-spacing:-1.5px}.date{font-size:13px;color:#888}.add{display:flex;gap:10px;margin-bottom:20px}input{flex:1;border:1px solid #ddd;border-radius:14px;background:white;padding:14px 16px;font-size:16px;outline:none}input:focus{border-color:#999}.btn{border:0;border-radius:14px;background:#222;color:#fff;padding:0 20px;font-size:15px;cursor:pointer}.filters{display:flex;gap:8px;margin-bottom:18px}.filter{border:0;background:transparent;padding:7px 12px;border-radius:10px;color:#777;cursor:pointer}.filter.active{background:#e5e5e2;color:#222}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px;background:white;border-radius:15px;padding:14px 15px;box-shadow:0 1px 2px #00000008}.check{width:21px;height:21px;border:1.5px solid #bbb;border-radius:50%;cursor:pointer;flex:none}.done .check{background:#222;border-color:#222;position:relative}.done .check:after{content:'✓';color:#fff;position:absolute;font-size:13px;left:4px;top:0}.text{flex:1;font-size:15px;line-height:1.45}.done .text{text-decoration:line-through;color:#aaa}.del{border:0;background:transparent;color:#aaa;font-size:20px;cursor:pointer}.empty{text-align:center;color:#aaa;padding:50px 0}.footer{display:flex;justify-content:space-between;color:#999;font-size:13px;margin-top:18px}.clear{border:0;background:transparent;color:#888;cursor:pointer}@media(max-width:500px){.app{padding-top:35px}.title{font-size:32px}}
</style></head>
<body><main class="app"><div class="top"><div class="title">Todo</div><div class="date" id="date"></div></div><form class="add" id="form"><input id="input" autocomplete="off" placeholder="今天要做什么？"><button class="btn">添加</button></form><nav class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="active">待完成</button><button class="filter" data-filter="done">已完成</button></nav><section class="list" id="list"></section><div class="footer"><span id="count"></span><button class="clear" id="clear">清除已完成</button></div></main>
<script>
const KEY='todo-app-items-v1';let items=JSON.parse(localStorage.getItem(KEY)||'[]');let filter='all';
const input=document.querySelector('#input'),list=document.querySelector('#list'),count=document.querySelector('#count');
document.querySelector('#date').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());
function save(){localStorage.setItem(KEY,JSON.stringify(items))}function render(){let shown=items.filter(x=>filter==='all'||(filter==='done'?x.done:!x.done));list.innerHTML=shown.length?shown.map(x=>`<div class="item ${x.done?'done':''}" data-id="${x.id}"><button class="check" aria-label="完成"></button><div class="text">${escapeHtml(x.text)}</div><button class="del" aria-label="删除">×</button></div>`).join(''):'<div class="empty">暂无任务</div>';count.textContent=`${items.filter(x=>!x.done).length} 项待完成`}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();let text=input.value.trim();if(!text)return;items.unshift({id:Date.now(),text,done:false});input.value='';save();render()};
list.onclick=e=>{let item=e.target.closest('.item');if(!item)return;let id=Number(item.dataset.id);if(e.target.classList.contains('check')){let x=items.find(x=>x.id===id);x.done=!x.done}else if(e.target.classList.contains('del'))items=items.filter(x=>x.id!==id);save();render()};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});
document.querySelector('#clear').onclick=()=>{items=items.filter(x=>!x.done);save();render()};render();
</script></body></html>
